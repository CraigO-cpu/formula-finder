<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formula Finder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Formula Finder for Google Sheets & Excel</h1>
    <p>Describe your task or select a category to find the best formula!</p>
  </header>
  <main>
    <select id="categoryFilter" onchange="filterByCategory()">
      <option value="All">All Categories</option>
      <option value="Math">Math</option>
      <option value="Statistical">Statistical</option>
      <option value="Text">Text</option>
      <option value="Date">Date</option>
      <option value="Financial">Financial</option>
      <option value="Logical">Logical</option>
      <option value="Lookup">Lookup</option>
      <option value="Array">Array</option>
      <option value="Database">Database</option>
      <option value="Information">Information</option>
      <option value="Conditional Formatting">Conditional Formatting</option>
      <option value="Advanced">Advanced</option>
    </select>
    <textarea id="userInput" rows="4" placeholder="E.g., I need to sum numbers above 50 in a column"></textarea>
    <button onclick="findFormula()">Find Formula</button>
    <section id="results"></section>
  </main>
  <script src="formulas.js"></script>
  <script src="scripts.js"></script>
</body>
</html>

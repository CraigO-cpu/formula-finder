<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formula Finder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Formula Finder for Google Sheets & Excel</h1>
    <p>Describe your task, and I'll suggest the best formula!</p>
  </header>
  <main>
    <textarea id="userInput" rows="4" placeholder="E.g., I need to sum numbers above 50 in a column"></textarea>
    <button onclick="findFormula()">Find Formula</button>
    <section id="results"></section>
  </main>
  <script src="formulas.js"></script>
  <script src="scripts.js"></script>
</body>
</html>
